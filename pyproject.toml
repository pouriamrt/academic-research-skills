[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "examples",
    "docs",
    # Markdown is EXCLUDED deliberately. Ruff formats Python code blocks inside .md,
    # and this repo SHA-pins agent prompt files (check_v3_6_8_pattern_protection,
    # check_pipeline_boundary_semantics). Reformatting embedded snippets rewrites
    # those bytes and breaks the enforcement gates. Agent prompts are documents, not
    # source: format them by hand or not at all.
    "*.md",
]

[tool.ruff.lint]
# Staged adoption: the default set (E4,E7,E9,F) landed first, then I, RUF100 and UP
# one commit each so any single family can be reverted alone. Further families
# (SIM, PERF, ...) follow the same one-per-PR rule.
# NOTE: never run `--select <RULE> --fix` in ISOLATION. RUF100 (unused-noqa) judges
# suppressions against the SELECTED rules only, so an isolated run strips every noqa
# for unselected rules — it removed the F401 re-export guards and E402 late-import
# suppressions once already (reverted in 7b49cb9). Add to `select`, then run `ruff check`.
# PLW1510 (subprocess-run-without-check, 60 hits) and BLE001 (blind-except, 24)
# are held back on purpose: each encodes a real decision about failure handling
# in a repo whose guard design is about failing in a chosen direction.
select = ["E4", "E7", "E9", "F", "I", "RUF100", "UP"]

[tool.ruff.format]
# Pin LF explicitly rather than relying on ruff's default of "auto".
# Proven: with this set, `ruff format` normalizes a CRLF file back to LF —
# which is what Task 7 (repo-wide format pass) depends on.
# Not proven: whether this also prevents the LF -> CRLF flips seen across ~20
# files during Task 6's bulk `ruff check --fix`. Those were not reproducible in
# isolated tests with or without this setting, so the cause there may have been
# the editor rather than ruff. Pinning costs nothing and removes ruff as a
# variable either way.
# Context: core.autocrlf is false and .gitattributes pins only *.sh, so any flip
# on a .py/.toml/.yml is committed permanently.
line-ending = "lf"
# check_role_scoped_contract.py pins byte-exact source witnesses inside
# check_panel_synthesis.py (the DA-CRITICAL parser). `ruff format` reflows those
# expressions — semantically identical, witness broken. Excluding the file from
# the formatter keeps it byte-comparable with upstream too, which is what an
# upstream-owned, witness-pinned checker should be. `ruff check` still covers it.
exclude = ["scripts/check_panel_synthesis.py"]

[tool.mypy]
# Scoped deliberately to the write-scope guard: it is the security-critical path
# (a PreToolUse hook that decides allow/deny on every Write/Edit/MultiEdit/Bash).
# Repo-wide typing across 251 files is a separate project, out of scope here.
files = ["scripts/ars_write_scope_guard.py"]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
